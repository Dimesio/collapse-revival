# Publishes dist/ to GitHub Pages on every push to main, once the tests pass.
name: Publish the game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - name: Stamp the release on the offline copy
        run: |
          sed -i "s/^const VERSION = 'dev';$/const VERSION = '${GITHUB_SHA::12}';/" dist/sw.js
          grep -q "^const VERSION = '${GITHUB_SHA::12}';$" dist/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
